{% extends "base.html" %}

{% block title %}{{ t.run_word }} #{{ item }} · OVK{% endblock %}

{% block body %}
<p><a href="/?lang={{ t.lang }}">{{ t.back_all_runs }}</a></p>
<div id="run-shell" hx-get="/fragments/runs/{{ item }}?lang={{ t.lang }}" hx-trigger="load" hx-swap="innerHTML">
  <p class="hint">{{ t.loading }}</p>
</div>
{% endblock %}
