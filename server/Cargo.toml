[package]
name = "ovk-prototype-server"
version = "0.1.0"
edition = "2021"
description = "Rust + HTMX backend for the OVK red-team panel prototype. Talks to OVK exclusively over its flow queue (the rapids); holds enrichment data OVK doesn't."

[dependencies]
anyhow = "1"
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
axum = "0.7"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
